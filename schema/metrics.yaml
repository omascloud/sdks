          minimum: -2147483647
          type: number
          description: The average of all values in the sample set.
          example: 85.5
        min:
          maximum: 2147483647
          minimum: -2147483647
          type: number
          description: The minimum value in the sample set.
          example: 80
        max:
          maximum: 2147483647
          minimum: -2147483647
          type: number
          description: The maximum value in the sample set.
