[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["core/tests", "metrics/tests"]
pythonpath = ["core/src", "metrics/src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PYI"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F403"]
"metrics/**/generated/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
namespace_packages = true
explicit_package_bases = true
