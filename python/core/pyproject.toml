[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "omas-cloud-core"
version = "0.1.0"
description = "Shared runtime and authentication for Omas Cloud Python SDKs."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.10,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/omascloud"]
